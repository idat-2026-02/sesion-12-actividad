<html lang="es">
<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    --bg:      #FFC820;
    --dark:    #111827;
    --muted:   #374151;
    --card:    #ffffff;
    --border:  rgba(17,24,39,.1);
    --radius:  12px;
    --shadow:  0 2px 15px rgba(17,24,39,.08);
    --header-h: 120px;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f4f4f5; 
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--dark);
    color: #fff;
    padding: 20px 40px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .header-left h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -.02em;
  }
  .header-left h1 em { color: var(--bg); font-style: normal; }
  
  .header-eyebrow {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--bg);
    margin-bottom: 4px;
  }

  .header-stats {
    display: flex;
    gap: 10px;
  }
  .stat-chip {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.1);
    color: rgba(255,255,255,.9);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 100px;
  }
  .stat-chip b { color: var(--bg); }

  .dashboard-container {
    display: grid;
    grid-template-columns: 280px 1fr; 
    flex: 1;
    max-width: 1440px; 
    margin: 0 auto;
    width: 100%;
    gap: 20px;
    padding: 20px;
  }

  aside {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 20px;
    height: calc(100vh - var(--header-h) - 40px);
    position: sticky;
    top: calc(var(--header-h) + 20px);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }

  .nav-section-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin-bottom: 15px;
    color: var(--dark);
  }

  .week-nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    overflow-y: auto;
  }

  .wbtn {
    height: 50px;
    border-radius: 8px;
    border: 2px solid var(--dark);
    background: transparent;
    color: var(--dark);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all .2s;
    position: relative;
  }
  .wbtn:hover { background: rgba(17,24,39,.1); }
  .wbtn.active {
    background: var(--dark);
    color: var(--bg);
  }
  .wbtn.has-eval::after {
    content: '';
    position: absolute;
    top: 2px; right: 2px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #dc2626;
  }

  .main-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .progress-card {
    background: #fff;
    padding: 15px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  
  .progress-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
  }
  .progress-track {
    background: #e4e4e7;
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--dark);
    transition: width .4s ease;
  }

  .week-panel { display: none; }
  .week-panel.active {
    display: flex;
    flex-direction: column;
    gap: 15px;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .wk-head {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 10px;
  }
  .wk-big-num {
    font-size: 48px;
    font-weight: 900;
    color: var(--dark);
    opacity: 0.15;
  }
  .wk-info h2 {
    font-size: 20px;
    font-weight: 800;
  }
  .wk-bloque-tag {
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--muted);
    background: #e4e4e7;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .sessions-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .scard {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .scard-welcome { border-left: 6px solid var(--bg); }
  .scard-eval { background: var(--dark); color: #fff; }
  .scard-hito { border-left: 6px solid #d97706; }
  .scard-retro { border-left: 6px solid #2563eb; }

  .scard-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .snum { font-size: 10px; font-weight: 800; opacity: 0.6; text-transform: uppercase; }
  .sbadge {
    font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase;
  }
  .sbadge-yellow { background: var(--bg); color: var(--dark); }
  .sbadge-red    { background: #dc2626; color: white; }
  .sbadge-blue   { background: #2563eb; color: white; }
  .sbadge-amber  { background: #d97706; color: white; }

  .stitle { font-size: 15px; font-weight: 800; margin-bottom: 8px; min-height: 40px; }
  .stime { font-size: 11px; font-weight: 600; opacity: 0.6; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }

  .stopic-list { list-style: none; font-size: 12px; }
  .stopic-list li { margin-bottom: 6px; padding-left: 12px; position: relative; line-height: 1.4; }
  .stopic-list li::before { content: '•'; position: absolute; left: 0; color: var(--bg); font-weight: bold; }

  .eval-pct { font-size: 32px; font-weight: 900; color: var(--bg); margin-bottom: 5px; }
  .eval-desc { font-size: 12px; opacity: 0.7; margin-bottom: 12px; }
  .eval-items { list-style: none; font-size: 11px; }
  .eval-items li { margin-bottom: 4px; display: flex; gap: 6px; }
  .eval-items li::before { content: '✓'; color: var(--bg); font-weight: bold; }

  .legend {
    background: white;
    padding: 15px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    font-size: 11px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--muted); }
  .ldot { width: 8px; height: 8px; border-radius: 2px; }
  
  .bottom-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 10px;
  }
  .cbtn {
    background: var(--dark);
    color: var(--bg);
    border: none;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cbtn:disabled { opacity: 0.3; cursor: default; }

  @media (max-height: 800px) {
    .scard { padding: 15px; }
    .stitle { min-height: auto; font-size: 14px; }
    .wk-big-num { font-size: 32px; }
    .dashboard-container { padding: 10px; }
  }
</style>

      <div class="eval-pct">${s.evalPct}</div>
      <p class="eval-desc">${s.evalDesc}</p>
      <ul class="eval-items">${s.evalItems.map(i => `<li>${i}</li>`).join('')}</ul>
    </div>`;
  }
  return `
  <div class="scard ${s.variant}">
    <div class="scard-top"><span class="snum">${s.num}</span>${badgeHtml}</div>
    <div class="stitle">${s.title}</div>
    <div class="stime">${clockIcon}&nbsp;${s.time}</div>
    <ul class="stopic-list">${s.topics.map(t => `<li>${t}</li>`).join('')}</ul>
  </div>`;
}

function mkPanel(w, i) {
  return `
  <div class="week-panel${i === 0 ? ' active' : ''}" id="wp-${i}">
    <div class="wk-head">
      <div class="wk-big-num">${(i + 1).toString().padStart(2, '0')}</div>
      <div class="wk-info">
        <div class="wk-bloque-tag">${w.bloque}</div>
        <h2>${w.title}</h2>
      </div>
    </div>
    <div class="sessions-container">
      ${mkCard(w.s1)}
      ${mkCard(w.s2)}
    </div>
  </div>`;
}

let cur = 0;

function buildNav() {
  const nav = document.getElementById('week-nav');
  WEEKS.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'wbtn' + (i === 0 ? ' active' : '') + (w.hasEval ? ' has-eval' : '');
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
  });
}

function buildPanels() {
  document.getElementById('panels').innerHTML = WEEKS.map((w, i) => mkPanel(w, i)).join('');
}

function sync() {
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === WEEKS.length - 1;
  document.getElementById('ctrl-label').textContent = `Semana ${cur + 1} / ${WEEKS.length}`;
  document.getElementById('pct-text').textContent = `Semana ${cur + 1} de ${WEEKS.length}`;
  document.getElementById('prog-fill').style.width = `${((cur + 1) / WEEKS.length) * 100}%`;
}

function goTo(i) {
  document.getElementById(`wp-${cur}`).classList.remove('active');
  document.querySelectorAll('.wbtn')[cur].classList.remove('active');
  cur = i;
  document.getElementById(`wp-${cur}`).classList.add('active');
  document.querySelectorAll('.wbtn')[cur].classList.add('active');
  sync();
}

function navigate(d) {
  const n = cur + d;
  if (n >= 0 && n < WEEKS.length) goTo(n);
}

buildNav();
buildPanels();
sync();
</script>
</body>
</html>
